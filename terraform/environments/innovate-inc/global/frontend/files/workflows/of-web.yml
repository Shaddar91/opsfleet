#Managed by Terraform; edits made here are overwritten on its next apply.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
%{ for key in VITE_KEYS ~}
          ${key}: $${{ secrets.${key} }}
%{ endfor ~}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.ref == 'refs/heads/master'
        with:
          role-to-assume: $${{ secrets.AWS_ROLE_ARN }}
          aws-region: $${{ secrets.AWS_REGION }}
      - name: Publish the build to the artifact bucket
        if: github.ref == 'refs/heads/master'
        env:
          ARTIFACT_BUCKET: $${{ secrets.ARTIFACT_BUCKET }}
          ARTIFACT_PREFIX: $${{ secrets.ARTIFACT_PREFIX }}
        run: |
          tar -czf build.tar.gz -C dist .
          aws s3 cp build.tar.gz "s3://$ARTIFACT_BUCKET/$ARTIFACT_PREFIX/build_$GITHUB_SHA.tar.gz"

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  snyk:
    #fork PRs get no secrets; codeql and dependency-review still cover them
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SNYK_TOKEN: $${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vulnerable dependencies with a fix, high and critical
        run: npx --yes snyk@1.1307.4 test --severity-threshold=high --fail-on=upgradable
      - name: Code issues, high
        run: npx --yes snyk@1.1307.4 code test --severity-threshold=high

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    #one deploy at a time; a newer push replaces a waiting one, so the latest build wins
    concurrency:
      group: of-web-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARTIFACT_BUCKET: $${{ secrets.ARTIFACT_BUCKET }}
      ARTIFACT_PREFIX: $${{ secrets.ARTIFACT_PREFIX }}
      WEB_BUCKET: $${{ secrets.WEB_BUCKET }}
      DISTRIBUTION_ID: $${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: $${{ secrets.AWS_ROLE_ARN }}
          aws-region: $${{ secrets.AWS_REGION }}
      #the key is rebuilt from the commit, not passed from build: GitHub drops job outputs that contain a secret
      - name: Fetch this commit's build from the artifact bucket
        run: |
          aws s3 cp "s3://$ARTIFACT_BUCKET/$ARTIFACT_PREFIX/build_$GITHUB_SHA.tar.gz" build.tar.gz
          mkdir dist
          tar -xzf build.tar.gz -C dist
      #no --delete and index.html last: a cached old index.html still requests the old hashed assets
      - run: aws s3 sync dist/assets "s3://$WEB_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
      - run: aws s3 sync dist/ "s3://$WEB_BUCKET" --exclude "assets/*" --exclude index.html
      - run: aws s3 cp dist/index.html "s3://$WEB_BUCKET/index.html" --cache-control "no-cache, no-store, must-revalidate"
      - run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
