apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "of-load.fullname" . }}
  labels:
    {{- include "of-load.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "of-load.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "of-load.labels" . | nindent 8 }}
      annotations:
        checksum/levels: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "of-load.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "of-load.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ required "containerPort is required (Terraform sets it through the Argo CD Application)" .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: OF_API_URL
              value: {{ .Values.ofApiUrl | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.cors.allowedOrigins | quote }}
            - name: STRESS_LEVELS_FILE
              value: /etc/of-load/levels.json
            - name: STRESS_MAX_INFLIGHT
              value: {{ .Values.stress.maxInflight | quote }}
            - name: STRESS_MAX_CPU_MS
              value: {{ .Values.stress.maxCpuMs | quote }}
            - name: STRESS_MAX_MEM_MIB
              value: {{ .Values.stress.maxMemMib | quote }}
            - name: AUTH_CACHE_SECONDS
              value: {{ .Values.stress.authCacheSeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: levels
              mountPath: /etc/of-load
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: levels
          configMap:
            name: {{ include "of-load.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - labelSelector:
            matchLabels:
              {{- include "of-load.selectorLabels" $ | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
