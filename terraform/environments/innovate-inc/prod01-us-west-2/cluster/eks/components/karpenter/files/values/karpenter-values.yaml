serviceAccount:
  name: karpenter
nodeSelector:
  kubernetes.io/os: linux
  role: system
settings:
  clusterName: ${CLUSTER_NAME}
  interruptionQueue: ${INTERRUPTION_QUEUE_NAME}
controller:
  env:
    - name: AWS_REGION
      value: ${REGION}
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
