provider:
  name: aws
env:
  - name: AWS_DEFAULT_REGION
    value: ${jsonencode(REGION)}
policy: upsert-only
domainFilters:
  - ${jsonencode(DOMAIN_NAME)}
txtOwnerId: ${jsonencode(CLUSTER_NAME)}
sources:
  - ingress
  - service
serviceAccount:
  name: ${jsonencode(SERVICE_ACCOUNT)}
#domain_name sits below the zone apex: without --aws-zone-match-parent external-dns skips the zone
extraArgs:
  - --aws-zone-match-parent
  - ${jsonencode("--zone-id-filter=${ZONE_ID}")}
